name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build and Test
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    name: Build and Push Docker Image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:${{ github.sha }}

  deploy:
    name: Deploy to AWS Kubernetes
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Set image in manifest
        run: |
          sed -i "s|DOCKERHUB_USER/ci-cd-java-app:latest|${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:${{ github.sha }}|" k8s/deployment.yaml
      - name: Copy manifests to EC2
        run: scp -i ~/.ssh/key.pem -r k8s ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/
      - name: Apply and wait for rollout
        run: |
          ssh -i ~/.ssh/key.pem ubuntu@${{ secrets.EC2_HOST }} '
            sudo k3s kubectl apply -f /home/ubuntu/k8s/ &&
            sudo k3s kubectl rollout status deployment/java-app-deployment --timeout=120s &&
            sudo k3s kubectl get pods -o wide'
      - name: Verify application is reachable
        run: |
          sleep 10
          curl -fsS http://${{ secrets.EC2_HOST }}:30080/health
